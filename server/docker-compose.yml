version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: exam_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - exam_network

  # C# API 服務
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: exam_api
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - Redis__Connection=redis:6379
    depends_on:
      - redis
    networks:
      - exam_network
    volumes:
      - ./api:/app

volumes:
  redis_data:

networks:
  exam_network:
    driver: bridge
